name: Evening Nudge

on:
  schedule:
    # 14:30 UTC = 8:00 PM IST. Edit to change the time.
    - cron: "30 14 * * *"
  workflow_dispatch: {}

jobs:
  nudge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Send nudge if still pending
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python3 evening_nudge.py
