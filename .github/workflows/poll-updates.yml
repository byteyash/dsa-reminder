name: Poll Telegram Updates

on:
  schedule:
    # runs at :07, :22, :37, :52 - offset from round numbers (:00/:15/:30/:45)
    # on purpose, since those exact marks are the busiest times across all of
    # GitHub Actions and get delayed the most.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Poll for button presses
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python3 poll_updates.py

      - name: Commit status changes
        run: |
          git config user.name "dsa-reminder-bot"
          git config user.email "actions@github.com"
          git add status.json offset.json
          git diff --cached --quiet || git commit -m "Update problem status"
          git push
