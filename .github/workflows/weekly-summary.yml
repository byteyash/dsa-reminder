name: Weekly Summary

on:
  schedule:
    # 15:30 UTC Sunday = 9:00 PM IST Sunday. Edit to change the time.
    - cron: "30 15 * * 0"
  workflow_dispatch: {}

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Send weekly summary
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python3 weekly_summary.py
